# Activate with: SPRING_PROFILES_ACTIVE=prod
# Requires REDIS_URL (or REDIS_HOST) for shared matchmaking + table routing.
# Required env: RUMMY_JWT_SECRET, RUMMY_ALLOWED_ORIGINS, RUMMY_ADMIN_API_KEY, RUMMY_GAME_URL.

rummy:
  redis:
    enabled: true
  security:
    enforce-jwt: true
    allowed-origins: ${RUMMY_ALLOWED_ORIGINS}
    jwt:
      require-secret: true
  operator:
    game-url: ${RUMMY_GAME_URL}
    mock:
      # Test logins on a live server: set RUMMY_MOCK_OPERATOR_ENABLED=true and RUMMY_MOCK_OPERATOR_KEY.
      enabled: ${RUMMY_MOCK_OPERATOR_ENABLED:false}
      require-key: true
  mongo:
    transactions:
      enabled: ${RUMMY_MONGO_TRANSACTIONS:true}

management:
  health:
    redis:
      enabled: true

matchmaking:
  # Slightly longer window for real players to find each other in production
  ai-fallback-timeout-ms: ${MATCHMAKING_AI_FALLBACK_MS:30000}
  max-queue-timeout-ms: ${MATCHMAKING_MAX_QUEUE_MS:90000}
