server:
  port: 8081

spring:
  application:
    name: game-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  main:
    banner-mode: off
  data:
    mongodb:
      uri: mongodb://localhost:27017/rummy_db
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    redis-reactive:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

rummy:
  kafka:
    enabled: false
  websocket:
    endpoint: /ws/game
    allowed-origins: "*"
  game:
    turn-duration-seconds: 30
    auto-drop-missed-turns: 3

matchmaking:
  ai-fallback-timeout-ms: 15000
  max-queue-timeout-ms: 45000
