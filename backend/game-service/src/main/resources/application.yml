server:
  port: 8081

spring:
  application:
    name: game-service
  main:
    banner-mode: off
  data:
    mongodb:
      uri: mongodb://localhost:27017/rummy_db
      auto-index-creation: true

rummy:
  websocket:
    endpoint: /ws/game
    allowed-origins: "*"
  game:
    turn-duration-seconds: 30
    auto-drop-missed-turns: 3
