server:
  port: ${PORT:8081}
  instance-id: ${SERVER_INSTANCE_ID:}

spring:
  application:
    name: game-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      # Redis is wired manually via RedisConfig when rummy.redis.enabled=true
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  main:
    banner-mode: off
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/rummy_db}}
      auto-index-creation: true
    redis:
      # Used only when rummy.redis.enabled=true
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    redis-reactive:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

rummy:
  kafka:
    enabled: false
  redis:
    # Set true in production multi-node (REDIS_URL required)
    enabled: ${RUMMY_REDIS_ENABLED:false}
  websocket:
    endpoint: /ws/game
    allowed-origins: "*"
  game:
    turn-duration-seconds: 30
    auto-drop-missed-turns: 3

matchmaking:
  ai-fallback-timeout-ms: ${MATCHMAKING_AI_FALLBACK_MS:15000}
  max-queue-timeout-ms: ${MATCHMAKING_MAX_QUEUE_MS:45000}
