apiVersion: apps/v1
kind: Deployment
metadata:
  name: rummy-game-service
  namespace: rummy-platform
  labels:
    app: rummy-game-service
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rummy-game-service
  template:
    metadata:
      labels:
        app: rummy-game-service
    spec:
      # Live games get up to RUMMY_DRAIN_TIMEOUT_SECONDS (1200) to finish after SIGTERM; keep this larger.
      terminationGracePeriodSeconds: 1300
      containers:
        - name: game-service
          # Pin an immutable tag per release; ":latest" makes rollbacks and rolling updates unpredictable.
          image: rummy-platform/game-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http-ws
          envFrom:
            - configMapRef:
                name: rummy-config
            # SPRING_DATA_MONGODB_URI, RUMMY_JWT_SECRET, RUMMY_ADMIN_API_KEY — see secrets.example.yaml
            - secretRef:
                name: rummy-secrets
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "rummy-redis.rummy-platform.svc.cluster.local"
            - name: SERVER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Players on a pod that does not host their table are relayed to the hosting pod at this address.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUMMY_ADVERTISE_ADDRESS
              value: "$(POD_IP):8081"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the ingress time to drop this pod from rotation; the app then drains live games on SIGTERM.
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: rummy-game-service
  namespace: rummy-platform
spec:
  type: ClusterIP
  selector:
    app: rummy-game-service
  ports:
    - name: http-ws
      port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rummy-game-service-hpa
  namespace: rummy-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rummy-game-service
  minReplicas: 3
  maxReplicas: 20
  # JVM heap never shrinks, so a memory target would block scale-down; scale on CPU only.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    # Every removed pod drains for up to 20 minutes; remove them slowly.
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rummy-game-service-pdb
  namespace: rummy-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: rummy-game-service
