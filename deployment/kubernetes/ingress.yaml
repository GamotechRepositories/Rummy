apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rummy-ingress
  namespace: rummy-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "rummy-game-service"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "RUMMY_ROUTE"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  rules:
    - host: rummy.australia.example.com
      http:
        paths:
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: rummy-game-service
                port:
                  number: 8081
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: rummy-game-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rummy-frontend
                port:
                  number: 80
