apiVersion: v1
kind: ConfigMap
metadata:
  name: rummy-config
  namespace: rummy-platform
data:
  # Must match application-prod.yml
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8081"
  RUMMY_KAFKA_ENABLED: "false"
  RUMMY_ALLOWED_ORIGINS: "https://royalrummy.example.com"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MATCHMAKING_AI_FALLBACK_MS: "4000"
  MATCHMAKING_MAX_QUEUE_MS: "25000"
