# Template only — do not commit real values. Create the real secret with:
#   kubectl -n rummy-platform create secret generic rummy-secrets \
#     --from-literal=SPRING_DATA_MONGODB_URI='mongodb+srv://...' \
#     --from-literal=RUMMY_JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=RUMMY_ADMIN_API_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: rummy-secrets
  namespace: rummy-platform
type: Opaque
stringData:
  SPRING_DATA_MONGODB_URI: "mongodb+srv://USER:PASSWORD@HOST/rummy_db?retryWrites=true&w=majority"
  RUMMY_JWT_SECRET: "replace-with-at-least-32-random-bytes"
  RUMMY_ADMIN_API_KEY: "replace-with-random-hex"
