apiVersion: apps/v1
kind: Deployment
metadata:
  name: rummy-frontend
  namespace: rummy-platform
  labels:
    app: rummy-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rummy-frontend
  template:
    metadata:
      labels:
        app: rummy-frontend
    spec:
      containers:
        - name: frontend
          image: rummy-platform/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rummy-frontend
  namespace: rummy-platform
spec:
  type: ClusterIP
  selector:
    app: rummy-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
