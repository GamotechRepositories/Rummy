version: '3.8'

services:
  # -------------------------------------------------------------
  # Infrastructure Data Stores & Messaging
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: rummy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: rummy_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: rummy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rummy-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rummy-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # -------------------------------------------------------------
  # Spring Boot Game Services (Clustered Nodes)
  # -------------------------------------------------------------
  game-service-1:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: rummy-game-service-1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/rummy_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_INSTANCE_ID: game-server-node-1
      RUMMY_KAFKA_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  game-service-2:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: rummy-game-service-2
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/rummy_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_INSTANCE_ID: game-server-node-2
      RUMMY_KAFKA_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # React Web Application Frontend (Nginx Gateway)
  # -------------------------------------------------------------
  rummy-frontend:
    build:
      context: ../../frontend/rummy-web
      dockerfile: Dockerfile
    container_name: rummy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - game-service-1

  # -------------------------------------------------------------
  # Observability (Prometheus Metrics)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: rummy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  mongo_data:
  redis_data:
